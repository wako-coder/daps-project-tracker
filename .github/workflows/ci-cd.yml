name: CI/CD

on:
  push:
  pull_request:

# One run per branch at a time; a newer push to main never overtakes an older deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # The tests run against PostgreSQL, the same engine as production.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: tracker_test
      DB_USERNAME: tracker
      DB_PASSWORD: tracker

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy
    # The gate: this job starts only after `test` succeeded, and only for a push to main.
    # It is skipped until the APP_URL repository variable (the live URL) has been set.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.APP_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Ask Render to deploy this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::The RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"

      # Triggering a deploy is not the same as a deploy that worked. The job
      # goes green only when the live site reports this exact commit, which
      # also means the container started and its migrations ran.
      - name: Wait until this commit is live
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::The APP_URL repository variable is not set."
            exit 1
          fi
          for attempt in $(seq 1 90); do
            live=$(curl --silent --max-time 20 "${APP_URL}/version" || true)
            if echo "$live" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
              echo "Live: $live"
              exit 0
            fi
            echo "Attempt ${attempt}/90: not live yet"
            sleep 10
          done
          echo "::error::Commit ${GITHUB_SHA} was not live after 15 minutes."
          exit 1

      - name: Smoke test the live site
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null "${APP_URL}/up"
          curl --fail --silent --show-error --max-time 30 --output /dev/null "${APP_URL}/login"
